trigger:
- main

pool:
  name: ecommerce

variables:
  imageName: ecommerceapp

stages:
- stage: Build
  jobs:
  - job: BuildAndPush
    steps:
    - task: Docker@2
      displayName: Build and Push Image
      inputs:
        containerRegistry: 'ACR-ServiceConnection'
        repository: $(imageName)
        command: buildAndPush
        Dockerfile: 'app/Dockerfile'
        tags: |
          latest

- stage: Deploy
  dependsOn: Build
  jobs:
  - deployment: DeployToAKS
    environment: aks-dev
    strategy:
      runOnce:
        deploy:
          steps:
          - task: KubernetesManifest@1
            inputs:
              action: deploy
              kubernetesServiceConnection: 'ecommerce-aks-new'
              manifests: |
                k8s/deployment.yaml
                k8s/service.yaml
                k8s/hpa.yml